<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Animation: y = x² - 2x + 3</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --background: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .equation {
            font-style: italic;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .canvas-container {
            background: var(--panel);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 15px;
            position: relative;
        }

        canvas {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: block;
        }

        .controls {
            background: var(--panel);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 25px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            color: var(--primary);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-play {
            background-color: var(--primary);
            color: white;
        }

        .btn-play:hover { background-color: #1d4ed8; }

        .btn-reset {
            background-color: #e2e8f0;
            color: var(--text);
        }

        .btn-reset:hover { background-color: #cbd5e1; }

        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .stats-val {
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Definite Integration Animation</h1>
    <div class="equation">f(x) = x² - 2x + 3</div>

    <div class="container">
        <div class="canvas-container">
            <canvas id="graphCanvas" width="550" height="450"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Lower Limit (a): <span id="lbl-a" class="val-display">0.0</span></label>
                <input type="range" id="input-a" min="-1" max="4" step="0.1" value="0">
            </div>
